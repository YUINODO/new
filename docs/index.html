<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>saudade</title>
<style>
  :root { color-scheme: dark; --night: rgb(4, 3, 8); --ink: rgba(236, 222, 205, 0.45); --ink-strong: rgba(236, 222, 205, 0.85); --ember: rgb(255, 196, 140); }
  html, body { height: 100%; margin: 0; background: var(--night); overflow: hidden; }
  #saudade { position: fixed; inset: 0; background: var(--night); cursor: none; touch-action: none; user-select: none; -webkit-user-select: none; overflow: hidden; }
  #saudade canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #light { mix-blend-mode: screen; }
  .tint { position: absolute; inset: 0; background: var(--night); mix-blend-mode: lighten; pointer-events: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .controls { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; display: flex; gap: 4px; opacity: 0; pointer-events: none; transition: opacity 0.7s; }
  .controls.visible { opacity: 1; pointer-events: auto; cursor: auto; }
  .controls button { appearance: none; border: 0; background: none; padding: 8px; border-radius: 999px; color: var(--ink); cursor: pointer; transition: color 0.3s; }
  .controls button:hover, .controls button:focus-visible { color: var(--ink-strong); }
  .controls button:focus-visible { outline: 1px solid var(--ink); }
  .controls button[data-state="on"] { color: var(--ember); }
  .controls button:disabled { opacity: 0.4; }
  .controls svg { width: 20px; height: 20px; display: block; }
  .controls .slash { display: none; }
  .controls button[data-state="error"] .slash { display: inline; }
  .meter { position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 160px; display: grid; gap: 6px; pointer-events: none; }
  .meter div { height: 4px; transform-origin: left; transform: scaleX(0); }
  .meter div:nth-child(1) { background: rgba(255, 196, 140, 0.7); }
  .meter div:nth-child(2) { background: rgba(200, 215, 255, 0.7); }
  .meter div:nth-child(3) { height: 1px; background: rgba(255, 255, 255, 0.4); }
</style>
</head>

  <div class="tint" aria-hidden="true"></div>

    <button type="button" id="full" aria-label="全画面"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div class="meter" hidden aria-hidden="true"><div></div><div></div><div></div></div>
</div>
